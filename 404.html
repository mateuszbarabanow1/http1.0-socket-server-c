<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errore 404 - File non trovato</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #002244;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .contenitore {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px;
            background-color: #ffffff;
            border: 1px solid #dddddd;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.6em;
            font-weight: normal;
            color: #880000;
        }

        p {
            margin: 0 0 16px 0;
        }
    </style>
</head>
<body>
    <div class="contenitore">
        <h1>Errore 404: File non trovato sul Server C personalizzato</h1>
        <p>
            La risorsa richiesta non è presente nella directory locale del server.
            Verifica l'indirizzo URL oppure torna alla pagina principale del progetto.
        </p>
    </div>
</body>
</html>
